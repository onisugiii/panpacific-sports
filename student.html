<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PanPacific Sports — Student</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div>
        <div class="eyebrow" id="deptLabel">PanPacific Sports</div>
        <h1 class="display h1" id="welcomeName">SCOREBOARD</h1>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="pill-btn" id="myAccountBtn">My account</button>
        <button class="pill-btn" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="section-label">🏆 Overall Championship Points</div>
    <div id="overallPoints" style="margin-bottom:28px;"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="join">Join a sport</button>
      <button class="tab-btn" data-tab="mine">My registrations</button>
      <button class="tab-btn" data-tab="schedule">Schedule</button>
      <button class="tab-btn" data-tab="standings">Standings</button>
    </div>

    <div id="tab-join"></div>
    <div id="tab-mine" style="display:none;"></div>
    <div id="tab-schedule" style="display:none;"></div>
    <div id="tab-standings" style="display:none;"></div>
  </div>

  <footer class="site-footer">© 2026 Mark Dave Leaño · Panpacific Sports</footer>

  <div id="modalRoot"></div>

<script src="js/api.js"></script>
<script src="js/student.js"></script>
</body>
</html>
